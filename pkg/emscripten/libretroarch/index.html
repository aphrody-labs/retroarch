<!doctype html>
<!-- ?core=2048 loads 2048_libretro.js; ?bench=300 times that many iterations -->
<html>
<head>
<meta charset="utf-8">
<title>libretroarch</title>
<style>canvas { image-rendering: pixelated; width: 100%; max-width: 960px; }</style>
</head>
<body>
<canvas id="canvas"></canvas>
<pre id="out"></pre>
<script type="module">
import { start } from "./libretroarch.js";

const params = new URLSearchParams(location.search);
const core   = params.get("core") || "2048";
const bench  = Number(params.get("bench") || 0);
const out    = document.getElementById("out");
const t0     = performance.now();
const { default: factory } = await import(`./${core}_libretro.js`);
const ra     = await start(factory, { canvas: document.getElementById("canvas") });
const t1     = performance.now();

if (bench)
{
   const t2 = performance.now();
   for (let i = 0; i < bench; i++)
      ra.iterate();
   const t3 = performance.now();
   out.textContent = JSON.stringify({
      startup_ms: +(t1 - t0).toFixed(1),
      iterate_us: +((t3 - t2) * 1000 / bench).toFixed(1),
      frames: bench
   });
   document.title = "done";
}
else
   ra.run();
</script>
</body>
</html>
